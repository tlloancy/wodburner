<main id="contenu" class="wrap">
  {{header}}
  <h1>{{h1}}</h1>
  <p class="lead">{{lead}}</p>
  <p id="missing">{{missing}}</p>
  <article id="wod-panel" hidden>
    <h2 id="wod-title"></h2>
    <pre id="wod-text" class="wod-text"></pre>
    <p><a id="launch" class="btn btn-accent" href="/{{lang}}/timers/">{{launch}}</a></p>
    <h2>{{results}}</h2>
    <ul id="wod-results" class="results"></ul>
  </article>
  {{footer}}
</main>
