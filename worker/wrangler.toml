name = "wodburner-scan"
main = "index.ts"
compatibility_date = "2026-11-02"

[vars]
ALLOWED_ORIGIN = "https://wodburner.app"
GEMINI_MODEL = "gemini-2.5-flash"
SCANS_PER_IP_PER_DAY = "5"
SCANS_GLOBAL_PER_DAY = "500"

# Create with: npx wrangler kv namespace create WODBURNER
# Then replace the id below. GEMINI_API_KEY and TURNSTILE_SECRET are secrets, not vars.
[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"
